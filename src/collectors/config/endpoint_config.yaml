# src/collectors/config/endpoint_config.yaml

# エンドポイント設定
endpoints:
  # 変更リスト取得
  changes:
    enabled: true
    class: ChangesEndpoint
    priority: 1  # 実行優先度（低い方が先）
    
  # 変更詳細取得（/detail を Change 1件ごとに叩く=約3.7万リクエストで非常に重い。
  # 提供する messages/owner/labels 等は changes 一覧クエリの MESSAGES+DETAILED_ACCOUNTS+
  # ALL_REVISIONS で既に取得済みなので、今回の分析には冗長。普段は無効。）
  change_detail:
    enabled: false
    class: ChangeDetailEndpoint
    priority: 2
    depends_on: [changes]  # 依存関係

  # Included In取得（解析側で未使用。1件ごとに叩くと約3.7万リクエストで重いだけなので無効）
  included_in:
    enabled: false
    class: IncludedInEndpoint
    priority: 3
    depends_on: [change_detail]
    
  # コメント取得
  comments:
    enabled: false
    class: CommentsEndpoint
    priority: 3
    depends_on: [change_detail]
    
  # レビュワー取得
  reviewers:
    enabled: false
    class: ReviewersEndpoint
    priority: 3
    depends_on: [change_detail]
    
  # ファイル内容取得
  file_content:
    enabled: false
    class: FileContentEndpoint
    priority: 4
    depends_on: [change_detail]
    filter:
      language: Python  # Pythonファイルのみ
    
  # ファイル差分取得（各 revision・各ファイルの実 diff）
  # 現在の解析（15 特徴量）は changes/*.json の revisions[x].files だけで足りており、
  # ここで取る diff は一度も読まれない。nova では commits/ が 16GB と changes/ の 5 倍を占めていた。
  # diff をモデルに使う設計にするときに有効化する。
  file_diff:
    enabled: false
    class: FileDiffEndpoint
    priority: 4
    depends_on: [change_detail]

  # コミット情報取得（revision = patch set 単位の巡回。diff ループの起動に必要）
  # file_diff を無効にしたので不要。リビジョン数は changes/*.json の revisions から数えている
  # （calculate_revision_count の commits フォールバックは data/openstack/ を見ており、そこは存在しない）。
  commit:
    enabled: false
    class: CommitEndpoint
    priority: 5
    depends_on: [change_detail]
    
  # 親コミット取得
  commit_parents:
    enabled: false
    class: CommitParentsEndpoint
    priority: 6
    depends_on: [commit]

# 収集設定
collection:
  # バッチサイズ
  # 1 リクエストで要求する件数。
  # 以前は 100 だったが、chromium/src で測ったところ 500 のほうが 5.5 倍速い
  # （n=100 は 26 回 224 秒で 11 件/秒、n=500 は 6 回 41 秒で 61 件/秒）。
  # リクエスト数が減り、1 回あたりの固定費が効かなくなるため。
  # 大きすぎてサーバ側の実行時間制限に掛かる場合は、実行時に自動で半分に落とす。
  # 恒常的に通らないインスタンスは GERRIT_PROJECTS の batch_size で個別に下げる（Qt は 50）。
  batch_size: 500
  
  # 対象コンポーネント（constants.pyから読み込み可能）
  components: null  # nullの場合はconstants.OPENSTACK_CORE_COMPONENTSを使用
  
  # 期間設定（constants.pyから読み込み可能）
  start_date: null  # nullの場合はconstants.START_DATEを使用
  end_date: null    # nullの場合はconstants.END_DATEを使用

  # diff/commit を取る revision の範囲: "all"=全 revision / "first"=投稿時点(patch set 1)のみ。
  # commit/file_diff を有効化したときだけ効く。投稿時点だけなら取得量が激減する。
  revision_scope: first

  # 途中保存の粒度（年）。N=N年ごとにその範囲を取得→即保存（クラッシュ耐性＋レジューム）。
  # null / 0 なら分割せず最後に一括保存（従来動作）。
  checkpoint_years: 1

# リトライ設定
#
# 以前は max_retries=10 / base_delay=30 / max_delay=3840 だった。これだと
# 30→60→120→…→3840 秒と待ち続け、**1 つの失敗に最大 4 時間 15 分**を費やす
# （実際に Qt の収集で 4 時間 17 分を溶かした）。
# 取れない原因が毎回違いうる以上、長く待つより早く諦めて次へ進むほうがよい。
# 飛ばした Change は collection_manifest.jsonl に記録され、後から回収できる。
#
# 現在の設定での待ち時間の合計は 5+10+20+40+60 = 135 秒（約 2 分）。
retry:
  max_retries: 5
  base_delay: 5.0
  max_delay: 60.0
  backoff_factor: 2.0
  jitter: true

# ストレージ設定
storage:
  # 出力ディレクトリ
  output_dir: data/openstack_collected  # dataディレクトリ配下に保存（既存のopenstackディレクトリとは別）
  
  # 保存形式
  formats:
    - json  # 個別JSONファイル
    - csv   # サマリーCSV
